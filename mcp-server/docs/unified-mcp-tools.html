    .tool-name { font-size:19px; font-weight:800; margin:0 0 8px; word-break:break-all; }
    .tool-desc { white-space:pre-wrap; color:#25344d; max-height:220px; overflow:auto; padding-right:4px; }
    .badge { display:inline-flex; align-items:center; padding:3px 8px; border-radius:999px; background:var(--blue2); color:var(--blue); font-weight:700; font-size:12px; white-space:nowrap; }

下面是原 docstring：\n\n建议工作流（旧）：\n  0. 第一次写文档前 → 调 get_doc_template_spec 拿完整 spec（章节 / 表头 / 命名规则）\n  1. 写完 md → 调 validate_builder_doc 自检\n  2. passes_strict=False → 优先按 weak_sections_detail 里的 actual vs expected 列名 diff 修，\n     再按 missing_sections / advice 补章节\n  3. 重复至多 3 轮；仍不通过把问题原文列给用户决定\n  4. passes_strict=True 才把 md 输出给用户（或直接用 generate_app_from_doc / parse_design_doc）\n\n返回：\n    {\n      \"ok\": True,\n      \"score\": 0-100,                   # 综合分\n      \"level\": \"standard|partial|freeform\",\n      \"decision\": \"pure_code|hybrid_fallback|rewrite_first\",\n      \"passes_strict\": bool,            # score >= 90 且无 missing_sections，后端可纯代码解析\n      \"missing_sections\": [str],        # 缺的必填章节中文名\n      \"weak_sections\": [str],           # 表头不达标的章节中文名（人话清单）\n      \"weak_sections_detail\": [          # ← 新：每个 weak 章节的 actual vs expected diff\n          {\n            \"section\": \"数据模型\",\n            \"key\": \"models\",\n            \"actual_headers\": [...],     # agent 实际写的表头\n            \"expected_required\": [...],  # 必有列\n            \"expected_full\": [...],      # 完整 14/15 列等\n            \"missing_required\": [...],   # 缺哪几列必有列\n            \"extra_unused\": [...],       # 多了哪几列（很可能错别字）\n            \"table_index\": int,\n            \"subsection\": str|null,      # 字典等子章节场景填子章节名\n          }, ...\n      ],\n      \"signals\": {                       # 5 维子项打分（0~1）\n          \"section_coverage\": ...,       # 必填章节覆盖率（30 分权重）\n          \"header_format\": ...,          # ## N、名称 标题格式（15 分）\n          \"table_header_match\": ...,     # 表头与标准模板匹配率（25 分）\n          \"code_compliance\": ...,        # 编码字段命名合规（15 分）\n          \"ref_integrity\": ...           # 字典/模型引用闭合（15 分）\n      },\n      \"advice\": [str],                  # 给 agent 的下一步修补建议（人话）\n      \"parse_dryrun\": {                  # ← 新：让 validate 通过 = parse 一定通过\n          \"ok\": bool,                    # parse_document(strict=True) 是否成功\n          \"failed_modules\": [str],       #   <script>
    const tools = JSON.parse(document.getElementById('tool-data').textContent);
    const q = document.getElementById('q');
    const cat = document.getElementById('cat');
    const toc = document.getElementById('toc');
    const root = document.getElementById('tools');
    const cats = [...new Set(tools.map(t => t.category))].sort((a,b)=>a.localeCompare(b,'zh-CN'));
    for (const c of cats) {
      const opt = document.createElement('option'); opt.value = c; opt.textContent = c; cat.appendChild(opt);
    }
    const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const pretty = obj => JSON.stringify(obj, null, 2);
    function headersBlock(t) { return Object.entries(t.requestHeaders).map(([k,v]) => k + ': ' + v).join(String.fromCharCode(10)); }
    function oneLineDescription(t) {
      const text = String(t.description || '无说明')
        .replace(/```[\s\S]*?```/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      return text.length > 92 ? text.slice(0, 92) + '...' : text;
    }
    function paramsTable(t) {
      if (!t.parameters.length) return '<div class="empty">无参数，arguments 传空对象 <code>{}</code>。</div>';
      return '<table><thead><tr><th>参数</th><th>类型</th><th>必填</th><th>默认值</th><th>说明</th></tr></thead><tbody>' +
        t.parameters.map(p => '<tr><td><code>'+esc(p.name)+'</code></td><td>'+esc(p.type)+'</td><td>'+(p.required?'是':'否')+'</td><td><code>'+esc(p.defaultValue === undefined ? '-' : JSON.stringify(p.defaultValue))+'</code></td><td>'+esc(p.description || '-')+'</td></tr>').join('') +
        '</tbody></table>';
    }
    function card(title, content, copyText, extraClass='') {
      const id = 'copy_' + Math.random().toString(36).slice(2);
      setTimeout(() => {
        const btn = document.getElementById(id);
        if (btn) btn.addEventListener('click', async () => { await navigator.clipboard.writeText(copyText); btn.textContent = '已复制'; setTimeout(()=>btn.textContent='复制', 1000); });
      });
      return '<div class="card '+extraClass+'"><h3>'+esc(title)+'<button id="'+id+'" class="copy">复制</button></h3><pre>'+esc(content)+'</pre></div>';
    }
    function render() {
      const term = q.value.trim().toLowerCase();
      const selected = cat.value;
      const list = tools.filter(t => {
        const hay = [t.name, t.category, t.description, JSON.stringify(t.inputSchema)].join(' ').toLowerCase();
        return (!selected || t.category === selected) && (!term || hay.includes(term));
      });
      toc.innerHTML = list.map(t =>
        '<a href="#'+esc(t.name)+'" title="'+esc(t.description || '')+'">' +
          '<span class="toc-name">'+String(t.index).padStart(2,'0')+' · '+esc(t.name)+'</span>' +
          '<span class="toc-meta"><span class="toc-cat">'+esc(t.category)+'</span><span>'+esc(t.parameters.length)+' 个参数</span></span>' +
          '<span class="toc-desc">'+esc(oneLineDescription(t))+'</span>' +
        '</a>'
      ).join('');
      root.innerHTML = list.map(t => {
        const headerText = headersBlock(t);
        const reqText = pretty(t.requestBody);
        const resText = pretty(t.responseBody);
        const errText = pretty(t.errorBody);
        return '<article class="tool" id="'+esc(t.name)+'" data-category="'+esc(t.category)+'">' +
          '<div class="tool-head"><div><div class="tool-name">'+esc(t.index)+'. '+esc(t.name)+'</div><div class="tool-desc">'+esc(t.description || '无说明')+'</div></div><span class="badge">'+esc(t.category)+'</span></div>' +
          '<div class="body">' +
            '<div class="card"><h3>类型 / 入口</h3><table><tbody>' +
              '<tr><th>类型</th><td>'+esc(t.category)+'</td></tr>' +
              '<tr><th>协议</th><td>'+esc(t.protocol)+'</td></tr>' +
              '<tr><th>Method</th><td><code>'+esc(t.method)+'</code></td></tr>' +
              '<tr><th>URL</th><td><code>'+esc(t.endpoint)+'</code></td></tr>' +
            '</tbody></table></div>' +
            '<div class="card"><h3>参数</h3>'+paramsTable(t)+'</div>' +
            '<div class="grid">'+card('请求头 Headers', headerText, headerText)+card('请求体 Body', reqText, reqText)+'</div>' +
            '<div class="grid">'+card('成功返回 Response', resText, resText)+card('错误返回 Error', errText, errText)+'</div>' +
            (t.returnHint ? '<div class="card hint"><h3>业务返回说明</h3><pre>'+esc(t.returnHint)+'</pre></div>' : '<div class="card"><h3>业务返回说明</h3><div class="empty">工具说明中未声明固定业务返回结构；以 JSON-RPC <code>result.content[].text</code> 中的文本或 JSON 为准。</div></div>') +
          '</div></article>';
      }).join('');
    }
    q.addEventListener('input', render); cat.addEventListener('change', render); render();
  </script>

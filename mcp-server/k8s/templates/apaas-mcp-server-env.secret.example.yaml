# Example only. Do not apply this file as-is.
#
# Create the real Secrets in namespace apaas-mcp-server by migrating values from
# the existing apaas-builder apaas-backend-env / mcp-server-config Secrets, then
# applying a generated manifest with real values. This template intentionally
# lives under k8s/templates/ so `kubectl apply -k k8s/` will not overwrite a real
# Secret with placeholders.
#
# Create one Secret per environment:
# - apaas-mcp-server-staging-env
# - apaas-mcp-server-prod-env

apiVersion: v1
kind: Secret
metadata:
  name: apaas-mcp-server-staging-env
  namespace: apaas-mcp-server
type: Opaque
stringData:
  # ── 数据库 ──────────────────────────────────────────────────────
  # mysql StatefulSet 内部 DNS：mysql-0.mysql.apaas-mcp-server.svc.cluster.local
  DATABASE_URL: "mysql+aiomysql://apaas_builder:PLACEHOLDER_APP_PASSWORD_CHANGE_ME@mysql:3306/apaas_builder"

  # ── MCP 鉴权 ────────────────────────────────────────────────────
  # 自己生成：openssl rand -base64 32
  MCP_API_KEY: "PLACEHOLDER_MCP_API_KEY_CHANGE_ME"
  MCP_API_KEYS: "PLACEHOLDER_MCP_API_KEY_CHANGE_ME"
  MCP_ALLOWED_HOSTS: "agent.dfy.definesys.cn"

  # ── 外部访问路径 ────────────────────────────────────────────────
  BASE_PATH: "/mcp-server"
  ROOT_PATH: "/mcp-server"
  PUBLIC_BASE_URL: "https://agent.dfy.definesys.cn/mcp-server"

  # ── JWT 签名 ────────────────────────────────────────────────────
  # openssl rand -base64 48
  JWT_SECRET_KEY: "PLACEHOLDER_JWT_SECRET_CHANGE_ME"

  # ── aPaaS 平台 ─────────────────────────────────────────────────
  APAAS_BASE_URL: "https://apaas-trial.definesys.cn/backend"
  APAAS_TENANT_ID: "PLACEHOLDER_APAAS_TENANT_ID"

  # ── LLM API ────────────────────────────────────────────────────
  # 至少要一个 — MiniMax 走 anthropic-compat 端点；或直接走 anthropic.com
  LLM_API_KEY: "PLACEHOLDER_LLM_API_KEY"
  ANTHROPIC_BASE_URL: "https://api.minimaxi.com/anthropic"
  ANTHROPIC_API_KEY: "PLACEHOLDER_ANTHROPIC_API_KEY"

  # ── dolphin 平台对接 ────────────────────────────────────────────
  # 重购 / 重建后所有 dolphin agent code 都要重新生成（旧的失效）
  DOLPHIN_AGENT_CODE: "PLACEHOLDER_DOLPHIN_HELP_ASSISTANT_CODE"
  DOLPHIN_COPILOT_AGENT_CODE: "PLACEHOLDER_BUILDER_AGENT_CODE"
  DOLPHIN_CODING_AGENT_CODE: "PLACEHOLDER_CODING_AGENT_CODE"
  DOLPHIN_USE_USER_TOKEN: "true"
  DOLPHIN_SERVER_URL: "https://dolphin-trial.definesys.cn"

  # ── 公网回链基址 ────────────────────────────────────────────────
  AI_BUILDER_CHAT_DEEPLINK_BASE: "https://agent.dfy.definesys.cn"

  # ── MCP 内部回调 ────────────────────────────────────────────────
  MCP_INTERNAL_BASE: "http://127.0.0.1:8004/api"

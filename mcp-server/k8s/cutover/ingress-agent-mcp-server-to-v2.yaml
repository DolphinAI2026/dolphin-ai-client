# Cutover manifest only. Do not include this in k8s/kustomization.yaml.
#
# Use after deleting the old apaas-builder namespace Ingress that currently owns:
#   agent.dfy.definesys.cn/mcp-server/*
#
# This points the formal MCP path to the already-running apaas-mcp-server-v2
# Service in namespace apaas-mcp-server.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apaas-mcp-server-final
  namespace: apaas-mcp-server
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Forwarded-Prefix /mcp-server;
      proxy_set_header X-Forwarded-Host $host;
spec:
  ingressClassName: nginx
  rules:
    - host: agent.dfy.definesys.cn
      http:
        paths:
          - path: /mcp-server(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: apaas-mcp-server-v2
                port:
                  number: 80

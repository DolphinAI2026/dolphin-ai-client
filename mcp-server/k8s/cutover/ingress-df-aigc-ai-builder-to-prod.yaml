# Apply this file only during the formal prod cutover.
# It points https://df-aigc.dfy.definesys.cn/ai-builder/ to apaas-mcp-server-prod.
# Rollback target remains the old apaas-builder service/ingress.

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apaas-mcp-server-prod-ai-builder
  namespace: apaas-mcp-server
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Forwarded-Prefix /ai-builder;
      proxy_set_header X-Forwarded-Host $host;
spec:
  ingressClassName: nginx
  rules:
    - host: df-aigc.dfy.definesys.cn
      http:
        paths:
          - path: /ai-builder(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: apaas-mcp-server-prod
                port:
                  number: 80

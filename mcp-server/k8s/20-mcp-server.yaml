# MCP Server prod/staging Deployment + Service + PVC(workspaces)
# 旧正式服务 apaas-builder 不在这里管理；它必须保留作为正式入口回滚目标。

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspaces-staging
  namespace: apaas-mcp-server
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local
  resources:
    requests:
      storage: 50Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspaces-prod
  namespace: apaas-mcp-server
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local
  resources:
    requests:
      storage: 50Gi

---
apiVersion: v1
kind: Service
metadata:
  name: apaas-mcp-server-staging
  namespace: apaas-mcp-server
  labels:
    app: apaas-mcp-server
    env: staging
spec:
  type: ClusterIP
  selector:
    app: apaas-mcp-server
    env: staging
  ports:
    - name: http
      port: 80
      targetPort: 8004

---
apiVersion: v1
kind: Service
metadata:
  name: apaas-mcp-server-prod
  namespace: apaas-mcp-server
  labels:
    app: apaas-mcp-server
    env: prod
spec:
  type: ClusterIP
  selector:
    app: apaas-mcp-server
    env: prod
  ports:
    - name: http
      port: 80
      targetPort: 8004

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apaas-mcp-server-staging
  namespace: apaas-mcp-server
  labels:
    app: apaas-mcp-server
    env: staging
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: apaas-mcp-server
      env: staging
  template:
    metadata:
      labels:
        app: apaas-mcp-server
        env: staging
    spec:
      imagePullSecrets:
        - name: regcred-hub-dfy
      tolerations:
        - key: node.kubernetes.io/memory-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: apaas-mcp-server
          image: hub.dfy.definesys.cn/ai-builder/apaas-builder-mcp-server:staging-candidate
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004
              name: api
          env:
            - name: BASE_PATH
              value: /mcp-server
            - name: ROOT_PATH
              value: /mcp-server
            - name: PUBLIC_BASE_URL
              value: https://agent.dfy.definesys.cn/mcp-server
          envFrom:
            - secretRef:
                name: apaas-mcp-server-staging-env
          volumeMounts:
            - name: workspaces
              mountPath: /app/_online_coding
          resources:
            requests: { cpu: "10m", memory: "128Mi" }
            limits:   { cpu: "2",   memory: "4Gi" }
          readinessProbe:
            httpGet: { path: /api/health, port: 8004 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /api/health, port: 8004 }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: workspaces-staging

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apaas-mcp-server-prod
  namespace: apaas-mcp-server
  labels:
    app: apaas-mcp-server
    env: prod
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: apaas-mcp-server
      env: prod
  template:
    metadata:
      labels:
        app: apaas-mcp-server
        env: prod
    spec:
      imagePullSecrets:
        - name: regcred-hub-dfy
      tolerations:
        - key: node.kubernetes.io/memory-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: apaas-mcp-server
          image: hub.dfy.definesys.cn/ai-builder/apaas-builder-mcp-server:prod-candidate
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004
              name: api
          env:
            - name: BASE_PATH
              value: /ai-builder
            - name: ROOT_PATH
              value: /ai-builder
            - name: PUBLIC_BASE_URL
              value: https://df-aigc.dfy.definesys.cn/ai-builder
          envFrom:
            - secretRef:
                name: apaas-mcp-server-prod-env
          volumeMounts:
            - name: workspaces
              mountPath: /app/_online_coding
          resources:
            requests: { cpu: "10m", memory: "128Mi" }
            limits:   { cpu: "2",   memory: "4Gi" }
          readinessProbe:
            httpGet: { path: /api/health, port: 8004 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /api/health, port: 8004 }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: workspaces-prod

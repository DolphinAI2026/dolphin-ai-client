# MySQL 8.0 集群内 StatefulSet — 单实例 + PVC 持久化
# 注：local storage 漂移到别的 node 会丢数据。这是 ship-fast 临时方案，
# 生产建议迁到公司 RDS / 托管 MySQL。

---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: apaas-mcp-server
  labels:
    app: mysql
spec:
  clusterIP: None  # headless service — StatefulSet 推荐
  selector:
    app: mysql
  ports:
    - port: 3306
      name: mysql
      targetPort: 3306

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: apaas-mcp-server
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0.39
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: mysql-credentials
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --default-authentication-plugin=mysql_native_password
            - --max_connections=200
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          # 集群节点 CPU requests 已 99% 预占（每节点余 18m），requests 必须显式设极小
          # 值（10m）— 不设 cpu requests 时 k8s 默认 = limits（cpu=2），反而装不下。
          # 实际节点 CPU 使用 11-19%，cpu limit 2 完全够用 burst。
          resources:
            requests: { cpu: "10m", memory: "64Mi" }
            limits:   { cpu: "2",   memory: "2Gi" }
          readinessProbe:
            exec:
              command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"']
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: 3306 }
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local        # 集群默认；如要 local-path 改这
        resources:
          requests:
            storage: 20Gi

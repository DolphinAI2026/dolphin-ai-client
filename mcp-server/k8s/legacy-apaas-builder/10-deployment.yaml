---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apaas-builder-mcp-server
  namespace: apaas-builder
  labels:
    app: apaas-builder-mcp-server
    component: mcp-server
spec:
  replicas: 1
  # 2026-05-13: 集群 CPU requests 已 99%，rolling 模式 surge 1 个会卡 Pending；
  # mcp-server 单 pod 不追求 zero-downtime，先 kill 老的再起新的更稳
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: apaas-builder-mcp-server
  template:
    metadata:
      labels:
        app: apaas-builder-mcp-server
        component: mcp-server
    spec:
      imagePullSecrets:
        - name: regcred-hub-dfy
      containers:
        - name: mcp-server
          image: hub.dfy.definesys.cn/ai-builder/apaas-builder-mcp-server:20260517-0018-mcp-metadata-amd64
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8004
              protocol: TCP
          # MCP_API_KEY + MCP_ALLOWED_HOSTS 从 mcp-server-config secret 拿
          envFrom:
            - secretRef:
                name: mcp-server-config
          # MCP 工具调主服务 coding API；workspace/PVC/JDK/Maven 打包责任在 apaas-builder 主服务。
          # apaas-builder Service 的 80 端口是 nginx sidecar，API 需走 /ai-builder/api 前缀。
          env:
            - name: MCP_INTERNAL_BASE
              value: "http://apaas-builder/ai-builder/api"
            - name: APAAS_BASE_URL
              value: "https://apaas-trial.definesys.cn/backend"
          # backend.env 整文件 mount 进 /app/backend/.env，跟现有 apaas-builder pod 一样
          volumeMounts:
            - name: backend-env
              mountPath: /app/backend/.env
              subPath: backend.env
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8004
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # 2026-05-13: requests 故意压低（集群 CPU 紧张），limits 给足
            # 实际 mcp-server baseline 几十 m CPU 几百 Mi mem，spike 时靠 limits 兜
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: backend-env
          secret:
            secretName: apaas-backend-env
            items:
              - key: backend.env
                path: backend.env
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: apaas-builder-mcp-server
  namespace: apaas-builder
  labels:
    app: apaas-builder-mcp-server
spec:
  type: ClusterIP
  selector:
    app: apaas-builder-mcp-server
  ports:
    - name: http
      port: 8004
      targetPort: http
      protocol: TCP

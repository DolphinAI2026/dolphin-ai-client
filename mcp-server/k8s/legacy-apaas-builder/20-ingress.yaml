---
# mcp-server 同时挂两个 host：
# - df-aigc.dfy.definesys.cn (198.18.1.47, ingressClass=nginx) — 已验证可用
# - agent.dfy.definesys.cn (198.18.0.200) — memory 历史 host，但 LB 后面 503
#   （200 那台 LB 反代规则可能没指向这个 k8s nginx-ingress，需公司运维调整）
# 两个 host 都加，nginx-ingress controller 会根据 ingressclass 各自处理
# nginx ingress 用 regex path + rewrite-target /mcp-server/api/x → /api/x
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apaas-builder-mcp-server
  namespace: apaas-builder
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # MCP streamable HTTP 是长连接 + SSE，必须关 buffering + 大 timeout
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  rules:
    - host: df-aigc.dfy.definesys.cn
      http:
        paths:
          - path: /mcp-server(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: apaas-builder-mcp-server
                port:
                  number: 8004
    - host: agent.dfy.definesys.cn
      http:
        paths:
          - path: /mcp-server(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: apaas-builder-mcp-server
                port:
                  number: 8004

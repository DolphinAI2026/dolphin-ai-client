# Staging Ingress：agent.dfy.definesys.cn → /mcp-server/* → apaas-mcp-server-staging
# 正式入口 df-aigc.dfy.definesys.cn/ai-builder 不在默认 kustomization 中切换；
# 需要上线时使用 k8s/cutover/ingress-df-aigc-ai-builder-to-prod.yaml。

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apaas-mcp-server-staging
  namespace: apaas-mcp-server
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Forwarded-Prefix /mcp-server;
      proxy_set_header X-Forwarded-Host $host;
spec:
  ingressClassName: nginx
  rules:
    - host: agent.dfy.definesys.cn
      http:
        paths:
          - path: /mcp-server(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: apaas-mcp-server-staging
                port:
                  number: 80

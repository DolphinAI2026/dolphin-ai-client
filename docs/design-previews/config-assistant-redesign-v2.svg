<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1320" viewBox="0 0 760 1320">
  <defs>
    <filter id="shadow" x="-18%" y="-10%" width="136%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1e293b" flood-opacity=".15"/>
    </filter>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <style>
      .bg{fill:#edf2f7}
      .panel{fill:#fff;filter:url(#shadow)}
      .line{stroke:#e7edf5;stroke-width:1}
      .divider{stroke:#edf1f6;stroke-width:1}
      .font{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .title{fill:#17233c;font-weight:750;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .text{fill:#253858;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .muted{fill:#718096;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .blue{fill:#2563eb;font-weight:700;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .card{fill:#fff;stroke:#e5ebf3;stroke-width:1}
      .soft{fill:#f8fbff;stroke:#dfe8f5;stroke-width:1}
      .iconbtn{fill:#fff;stroke:#dfe7f2;stroke-width:1}
      .chip{fill:#f8fafc;stroke:#e3e9f2;stroke-width:1}
      .chipOn{fill:#eaf2ff;stroke:#bcd2fa;stroke-width:1}
      .primary{fill:#2563eb}
    </style>
  </defs>

  <rect class="bg" width="760" height="1320"/>
  <rect x="70" y="42" width="620" height="1236" rx="22" class="panel"/>

  <rect x="70" y="42" width="620" height="178" rx="22" fill="url(#top)"/>
  <line x1="70" y1="220" x2="690" y2="220" class="line"/>
  <text x="104" y="96" class="title" font-size="28">配置助手</text>
  <text x="104" y="130" class="muted" font-size="16">调整</text>
  <text x="150" y="130" class="text" font-size="16">易景QMS质量管理系统</text>
  <rect x="104" y="150" width="196" height="34" rx="17" fill="#eefdf5" stroke="#b9f2cf"/>
  <circle cx="124" cy="167" r="5" fill="#16a34a"/>
  <text x="139" y="173" fill="#166534" class="font" font-size="14">已识别当前功能页面</text>

  <rect x="500" y="72" width="42" height="42" rx="12" class="iconbtn"/>
  <path d="M511 86h20M511 94h20M511 102h14" stroke="#48617f" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="552" y="72" width="42" height="42" rx="12" class="iconbtn"/>
  <path d="M573 84v18M564 93h18" stroke="#48617f" stroke-width="2.3" stroke-linecap="round"/>
  <rect x="604" y="72" width="42" height="42" rx="12" class="iconbtn"/>
  <path d="M616 85l18 18M634 85l-18 18" stroke="#48617f" stroke-width="2.2" stroke-linecap="round"/>

  <rect x="104" y="246" width="552" height="92" rx="18" class="card"/>
  <text x="128" y="280" class="muted" font-size="15">当前上下文</text>
  <text x="128" y="312" class="title" font-size="22">质量标准文件库</text>
  <text x="374" y="286" class="muted" font-size="14">表单页面</text>
  <text x="374" y="314" class="muted" font-size="14">14 字段 · 5 必填 · 2 字典</text>
  <rect x="548" y="270" width="82" height="42" rx="13" fill="#f8fafc" stroke="#dfe7f2"/>
  <text x="568" y="297" class="blue" font-size="15">分析</text>

  <text x="104" y="384" class="title" font-size="18">常用调整</text>
  <rect x="104" y="406" width="128" height="44" rx="22" class="chipOn"/>
  <text x="137" y="434" class="blue" font-size="16">改字段</text>
  <rect x="244" y="406" width="128" height="44" rx="22" class="chip"/>
  <text x="277" y="434" class="text" font-size="16">新菜单</text>
  <rect x="384" y="406" width="128" height="44" rx="22" class="chip"/>
  <text x="417" y="434" class="text" font-size="16">调权限</text>
  <rect x="524" y="406" width="132" height="44" rx="22" class="chip"/>
  <text x="557" y="434" class="text" font-size="16">改流程</text>

  <rect x="104" y="480" width="552" height="170" rx="18" class="soft"/>
  <text x="128" y="516" class="title" font-size="17">推荐指令</text>
  <text x="128" y="548" class="muted" font-size="14">根据当前菜单自动生成，可直接点击填入输入框</text>
  <rect x="128" y="570" width="504" height="32" rx="16" fill="#fff" stroke="#e7ecf4"/>
  <text x="148" y="592" class="text" font-size="14">把标准名称设为必填，并同步校验提示</text>
  <rect x="128" y="610" width="504" height="32" rx="16" fill="#fff" stroke="#e7ecf4"/>
  <text x="148" y="632" class="text" font-size="14">给标准类型字典新增“临时标准”选项</text>

  <line x1="70" y1="684" x2="690" y2="684" class="divider"/>

  <rect x="104" y="724" width="410" height="86" rx="18" fill="#f1f6ff" stroke="#d8e6fb"/>
  <text x="128" y="756" fill="#2f4f87" class="font" font-size="15">助手</text>
  <text x="128" y="784" class="text" font-size="16">可以把字段规则、权限和流程一起改。</text>
  <text x="128" y="806" class="muted" font-size="13">执行前会先给你看变更摘要。</text>

  <rect x="264" y="846" width="392" height="76" rx="18" fill="#fff" stroke="#e7ecf4"/>
  <text x="288" y="876" class="text" font-size="16">把标准名称改成必填</text>
  <text x="288" y="900" class="muted" font-size="14">用户输入</text>

  <rect x="104" y="958" width="506" height="122" rx="18" fill="#fbfdff" stroke="#dbe7f6"/>
  <text x="128" y="990" class="title" font-size="17">待确认变更</text>
  <text x="128" y="1020" class="text" font-size="15">字段：标准名称</text>
  <text x="128" y="1048" class="text" font-size="15">规则：非必填 → 必填</text>
  <rect x="438" y="1016" width="76" height="38" rx="12" fill="#fff" stroke="#dfe7f2"/>
  <text x="462" y="1040" class="text" font-size="14">取消</text>
  <rect x="526" y="1016" width="64" height="38" rx="12" class="primary"/>
  <text x="544" y="1040" fill="#fff" class="font" font-size="14" font-weight="700">应用</text>

  <line x1="70" y1="1112" x2="690" y2="1112" class="divider"/>
  <rect x="104" y="1134" width="552" height="118" rx="18" fill="#fff" stroke="#dfe7f2"/>
  <rect x="126" y="1154" width="166" height="30" rx="15" fill="#f4f7fb" stroke="#e4eaf2"/>
  <path d="M145 1170c8-11 18-11 25-3l17 18c5 5 12 5 17 0 5-5 5-12 0-17l-20-20" fill="none" stroke="#718096" stroke-width="1.8" stroke-linecap="round"/>
  <text x="176" y="1175" class="muted" font-size="13">质量规范.docx</text>
  <text x="126" y="1216" class="muted" font-size="16">输入需求，或拖入截图/文档作为上下文...</text>
  <circle cx="588" cy="1206" r="22" fill="#f3f6fa" stroke="#dfe7f2"/>
  <path d="M579 1208l16-16c5-5 13-2 13 5 0 3-1 5-3 7l-20 20c-7 7-18 2-18-8 0-4 2-8 5-11l21-21" fill="none" stroke="#718096" stroke-width="2" stroke-linecap="round"/>
  <rect x="616" y="1184" width="28" height="44" rx="14" class="primary"/>
  <path d="M630 1213v-19M622 1202l8-8 8 8" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="104" y="1280" class="muted" font-size="13">顶部去掉部署历史和上传；附件跟随当前对话提交，便于 AI 理解这次修改。</text>
</svg>

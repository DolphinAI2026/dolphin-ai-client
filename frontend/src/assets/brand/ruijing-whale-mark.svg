    <path data-logo-part="head" fill="#FFFFFF" d="M276 373c36-28 78-42 124-46 43-4 83 1 94 16 4 6 2 14-4 19-37 10-76 21-116 34-35 11-72 16-111 13 3-13 8-25 13-36Z"/>
  </g>

  <path data-logo-part="eye" d="M274 348c10-5 22-4 31 4-8 7-21 9-33 3-2-2-1-5 2-7Z" fill="#0769A9"/>

  <g data-logo-part="mouth-lines" fill="none" stroke="#086BAE" stroke-width="7" stroke-linecap="round">

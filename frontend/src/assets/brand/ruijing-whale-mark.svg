<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="dc-title dc-desc">
  <title id="dc-title">Dolphin Code 标识</title>
  <desc id="dc-desc">蓝青渐变圆角图标，白色跃起的海豚，下方有 &lt;/&gt; 代码符号。</desc>
  <defs>
    <linearGradient id="dc-bg" x1="88" y1="24" x2="424" y2="486" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#073D8B"/>
      <stop offset="0.52" stop-color="#075FA8"/>
      <stop offset="1" stop-color="#1CC9D9"/>
    </linearGradient>
    <linearGradient id="dc-glow" x1="118" y1="20" x2="426" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.64" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dc-body" x1="150" y1="120" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF8FF"/>
    </linearGradient>
    <filter id="dc-shadow" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#06235F" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="92" fill="url(#dc-bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="82" fill="url(#dc-glow)"/>

  <!-- leaping dolphin (snout upper-right, forked tail lower-left) -->
  <g filter="url(#dc-shadow)">
    <path fill="url(#dc-body)" d="
      M 410 138
      C 372 142 342 158 322 188
      C 300 178 286 180 286 180
      C 296 196 300 206 300 220
      C 276 244 252 278 232 318
      C 222 300 214 282 212 262
      C 196 286 196 318 214 344
      C 188 356 166 372 150 396
      C 190 388 226 368 256 338
      C 300 360 352 352 388 318
      C 360 318 334 318 312 308
      C 344 286 372 252 388 212
      C 398 188 420 168 410 138 Z"/>
    <!-- pectoral flipper -->
    <path fill="#CFEEFF" d="M 286 296 C 268 318 258 344 256 372 C 280 350 300 324 312 296 Z"/>
  </g>
  <!-- eye -->
  <circle cx="356" cy="176" r="10" fill="#07407F"/>

  <!-- </> code motif -->
  <g fill="none" stroke="#A4F2FF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="152,402 120,424 152,446"/>
    <polyline points="360,402 392,424 360,446"/>
  </g>
  <line x1="300" y1="396" x2="212" y2="452" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
</svg>

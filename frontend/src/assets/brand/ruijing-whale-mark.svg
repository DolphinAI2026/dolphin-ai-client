<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="ruijing-whale-title ruijing-whale-desc">
  <title id="ruijing-whale-title">睿鲸 Builder 智能鲸鱼标识</title>
  <desc id="ruijing-whale-desc">蓝青渐变圆角图标，白色鲸鱼从左上鲸尾延展到右下鲸头，背部连接 AI 电路节点。</desc>
  <defs>
    <linearGradient id="ruijing-bg" x1="88" y1="24" x2="424" y2="486" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#073D8B"/>
      <stop offset="0.52" stop-color="#075FA8"/>
      <stop offset="1" stop-color="#1CC9D9"/>
    </linearGradient>
    <linearGradient id="ruijing-bg-glow" x1="118" y1="20" x2="426" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.64" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruijing-whale-soft" x1="122" y1="98" x2="398" y2="421" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5FCFF"/>
    </linearGradient>
    <linearGradient id="ruijing-line" x1="197" y1="156" x2="440" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9FF2FF"/>
      <stop offset="0.38" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="ruijing-soft-shadow" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#06235F" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="92" fill="url(#ruijing-bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="82" fill="url(#ruijing-bg-glow)"/>

  <g filter="url(#ruijing-soft-shadow)">

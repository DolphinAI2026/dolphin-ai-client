<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aPaaS Builder AI</title>
    <!-- 字体栈走系统兜底：Google Fonts 在国内访问超时（fonts.googleapis.com 被墙），
         会让首屏白屏 30 秒。如果未来想用 Inter，可以走 @fontsource/inter 把字体打进 bundle。 -->
    <script>
      // Prevent flash of wrong theme (FOWT)
      ;(function() {
        var saved = localStorage.getItem('theme')
        var t = saved === 'dark' || saved === 'light' ? saved : 'light'
        document.documentElement.setAttribute('data-theme', t)
        if (t === 'dark') document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

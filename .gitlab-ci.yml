workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger"'
      when: always
    - when: never

stages:
  - verify
  - release

variables:
  BUILDER_IMAGE_REPOSITORY: "om-harbor.dfy.definesys.cn/om-demo/ai-builder"
  BUILDER_K8S_NAMESPACE: "orcamatrix-demo"
  BUILDER_K8S_STATEFULSET: "ai-builder"
  BUILDER_K8S_BACKEND_CONTAINER: "ai-builder"
  BUILDER_K8S_DIST_INIT_CONTAINER: "copy-frontend-dist"
  BUILDER_VITE_BASE_URL: "/ai-builder/"
  BUILDER_ROLLOUT_TIMEOUT: "300s"
  BUILDER_CONTROL_PLANE_URL: "https://om-demo.dfy.definesys.cn/control-plane"

verify_builder:
  stage: verify
  image:
    name: hub-mirror.dfy.definesys.cn/library/python:3.12-alpine
    entrypoint: [""]
  before_script:
    - apk add --no-cache bash
  script:
    - bash -n deploy/docker/entrypoint.sh deploy/customer/deploy.sh scripts/deploy_k8s_dev.sh scripts/deploy_online_latest_kubesphere.sh scripts/deploy_k8s_dev_web_terminal.sh
    - python3 -m compileall -q backend/app

release_and_update_server:
  stage: release
  image:
    name: hub-mirror.dfy.definesys.cn/moby/buildkit:v0.25.2
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: "--oci-worker-no-process-sandbox"
  rules:
    - if: '$RUN_RELEASE_AND_UPDATE_SERVER == "1" && $BUILDER_RELEASE_CONFIRM == "release-and-update-server"'
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache bash kubectl python3
  script:
    - test -n "${APAAS_DOCKER_USERNAME:-}"
    - test -n "${APAAS_DOCKER_PASSWORD:-}"
    - test -n "${APAAS_KUBECONFIG_B64:-}${APAAS_KUBECONFIG:-}"
    - export BUILDER_IMAGE_TAG="${BUILDER_IMAGE_TAG:-$(date +%Y.%m.%d)-${CI_COMMIT_SHORT_SHA}}"
    - export BUILDER_IMAGE="${BUILDER_IMAGE_REPOSITORY}:${BUILDER_IMAGE_TAG}"
    - export DOCKER_CONFIG="${CI_PROJECT_DIR}/.docker"
    - mkdir -p "${DOCKER_CONFIG}"
    - |
      python3 - <<'PY'
      import base64
      import json
      import os
      from pathlib import Path

      registry = os.environ["BUILDER_IMAGE_REPOSITORY"].split("/", 1)[0]
      credentials = (
          f'{os.environ["APAAS_DOCKER_USERNAME"]}:'
          f'{os.environ["APAAS_DOCKER_PASSWORD"]}'
      ).encode()
      config = {
          "auths": {
              registry: {
                  "auth": base64.b64encode(credentials).decode(),
              }
          }
      }
      Path(os.environ["DOCKER_CONFIG"], "config.json").write_text(
          json.dumps(config),
          encoding="utf-8",
      )
      PY
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt filename=deploy/docker/Dockerfile \
        --opt "build-arg:VITE_BASE_URL=${BUILDER_VITE_BASE_URL}" \
        --output "type=image,name=${BUILDER_IMAGE},push=true"
    - |
      if [ -n "${APAAS_KUBECONFIG_B64:-}" ]; then
        printf '%s' "${APAAS_KUBECONFIG_B64}" | base64 -d > /tmp/kubeconfig
      else
        cp "${APAAS_KUBECONFIG}" /tmp/kubeconfig
      fi
      chmod 600 /tmp/kubeconfig
      export KUBECONFIG=/tmp/kubeconfig
      kubectl -n "${BUILDER_K8S_NAMESPACE}" set image \
        "statefulset/${BUILDER_K8S_STATEFULSET}" \
        "${BUILDER_K8S_BACKEND_CONTAINER}=${BUILDER_IMAGE}" \
        "${BUILDER_K8S_DIST_INIT_CONTAINER}=${BUILDER_IMAGE}"
      kubectl -n "${BUILDER_K8S_NAMESPACE}" rollout status \
        "statefulset/${BUILDER_K8S_STATEFULSET}" \
        --timeout="${BUILDER_ROLLOUT_TIMEOUT}"
      printf 'builderImage=%s\n' "${BUILDER_IMAGE}"

update_builder_runtime_config:
  stage: release
  image:
    name: hub-mirror.dfy.definesys.cn/library/python:3.12-alpine
    entrypoint: [""]
  rules:
    - if: '$RUN_BUILDER_CONFIG_UPDATE == "1" && $BUILDER_CONFIG_CONFIRM == "update-builder-config"'
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache kubectl
  script:
    - |
      if [ -n "${APAAS_KUBECONFIG_B64:-}" ]; then
        printf '%s' "${APAAS_KUBECONFIG_B64}" | base64 -d > /tmp/kubeconfig
      else
        cp "${APAAS_KUBECONFIG}" /tmp/kubeconfig
      fi
      chmod 600 /tmp/kubeconfig
      export KUBECONFIG=/tmp/kubeconfig
    - kubectl -n "${BUILDER_K8S_NAMESPACE}" get secret ai-builder-backend-env -o json > /tmp/backend-secret.json
    - |
      python3 - <<'PY'
      import base64
      import hashlib
      import json
      import os
      from pathlib import Path

      secret = json.loads(Path("/tmp/backend-secret.json").read_text(encoding="utf-8"))
      encoded = secret["data"]["backend.env"]
      text = base64.b64decode(encoded).decode("utf-8")
      key = "DOLPHIN_CODE_CONTROL_PLANE_URL"
      value = os.environ["BUILDER_CONTROL_PLANE_URL"].rstrip("/")
      lines = text.splitlines()
      output = []
      replaced = False
      for line in lines:
          if line.startswith(f"{key}="):
              if not replaced:
                  output.append(f"{key}={value}")
                  replaced = True
              continue
          output.append(line)
      if not replaced:
          output.extend(["", f"{key}={value}"])
      updated = "\n".join(output).rstrip() + "\n"
      digest = hashlib.sha256(updated.encode()).hexdigest()
      patch = {
          "data": {
              "backend.env": base64.b64encode(updated.encode()).decode(),
          }
      }
      Path("/tmp/backend-secret-patch.json").write_text(json.dumps(patch), encoding="utf-8")
      Path("/tmp/backend-env-checksum").write_text(digest, encoding="utf-8")
      PY
    - kubectl -n "${BUILDER_K8S_NAMESPACE}" patch secret ai-builder-backend-env --type merge --patch-file /tmp/backend-secret-patch.json
    - |
      checksum="$(cat /tmp/backend-env-checksum)"
      kubectl -n "${BUILDER_K8S_NAMESPACE}" patch "statefulset/${BUILDER_K8S_STATEFULSET}" \
        --type merge \
        -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"checksum/backend-env\":\"${checksum}\"}}}}}"
    - kubectl -n "${BUILDER_K8S_NAMESPACE}" rollout status "statefulset/${BUILDER_K8S_STATEFULSET}" --timeout="${BUILDER_ROLLOUT_TIMEOUT}"
    - rm -f /tmp/kubeconfig /tmp/backend-secret.json /tmp/backend-secret-patch.json /tmp/backend-env-checksum

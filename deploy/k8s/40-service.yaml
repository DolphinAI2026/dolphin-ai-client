apiVersion: v1
kind: Service
metadata:
  name: apaas-builder
  namespace: apaas-builder
  labels:
    app: apaas-builder
spec:
  type: ClusterIP
  selector:
    app: apaas-builder
  ports:
    - name: http
      port: 80
      targetPort: http
---
# StatefulSet 必需的 Headless Service（serviceName 字段指过来的）
apiVersion: v1
kind: Service
metadata:
  name: apaas-builder-headless
  namespace: apaas-builder
spec:
  clusterIP: None
  selector:
    app: apaas-builder
  ports:
    - name: http
      port: 80

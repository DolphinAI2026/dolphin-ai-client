apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apaas-builder
  namespace: apaas-builder
  labels:
    app: apaas-builder
spec:
  serviceName: apaas-builder-headless
  replicas: 1
  selector:
    matchLabels:
      app: apaas-builder
  template:
    metadata:
      labels:
        app: apaas-builder
    spec:
      # 固定到 app-tier 节点（集群里目前只有 i8vbj7weas0dx1id3v9wa 有这标签）
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: apaas.definesys.com/app-tier
                    operator: Exists

      # 把镜像里的 /app/frontend/dist 拷到共享卷，sidecar nginx 从那里 serve
      initContainers:
        - name: copy-frontend-dist
          image: hub.dfy.definesys.cn/ai-builder/apaas-builder:20260428-ruijing
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              rm -rf /share/dist/*
              cp -R /app/frontend/dist/. /share/dist/
              echo "dist files:" && ls /share/dist/ | head
          volumeMounts:
            - name: frontend-dist
              mountPath: /share/dist

      containers:
        # 主容器：uvicorn + code-server（由 supervisord 管）
        - name: apaas-builder
          image: hub.dfy.definesys.cn/ai-builder/apaas-builder:20260428-ruijing
          imagePullPolicy: IfNotPresent
          env:
            # K8s 同 Pod 内 container 共享 network namespace，nginx sidecar 用 localhost 连过来
            # code-server 只绑 127.0.0.1 即可（同 Pod 内通）
            - name: CODE_SERVER_BIND_HOST
              value: "127.0.0.1"
            - name: WAIT_FOR_MYSQL
              value: "1"
            # backend/app/coding/workspace.py 直接读取进程环境变量；
            # 仅写在 backend.env 文件里不会生效，必须在 Pod env 显式注入。
            - name: APAAS_WORKSPACE_ROOT
              value: "/root/apaas-builder/workspaces"
            - name: APAAS_NPM_CACHE_DIR
              value: "/root/apaas-builder/workspaces/.npm-cache"
          ports:
            - { name: api, containerPort: 8003 }
            - { name: ide, containerPort: 8080 }
          volumeMounts:
            - name: workspaces
              mountPath: /root/apaas-builder/workspaces
            - name: backend-env
              mountPath: /app/backend/.env
              subPath: backend.env
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: api
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: api
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

        # Sidecar：nginx serve 前端 dist + 反代 /api /ide 到本 Pod 主容器
        - name: web
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 80 }
          volumeMounts:
            - name: frontend-dist
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: apaas-workspaces
        - name: backend-env
          secret:
            secretName: apaas-backend-env
        - name: frontend-dist
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: apaas-builder-nginx

      imagePullSecrets:
        - name: regcred-hub-dfy

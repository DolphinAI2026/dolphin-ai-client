# Vibe-coding 沙箱 Ingress — 方案 B 占位（per-workspace 动态 Ingress）
#
# ⚠️ 历史：本文件最初实现方案 A（通配 `*.vibe-first.cn` + server-snippet/
#    configuration-snippet 提取 ws_id 动态 proxy_pass）。2026-05-15 该方案
#    撞 nginx "if is evil" 限制 — proxy_* directive 不允许在 if-block 内，
#    nginx config gen [emerg]，4 个 ingress-nginx controller pod 全跑 stale
#    config，公网 504。当时 `kubectl delete ingress vibe-sandboxes` 救场。
#
#    详情：memory `handoff_2026_05_15_late.md` 第 1 件事 +
#         docs/vibe-k8s-migration/00-design.md 第 154 行 "撞兼容性切方案 B"。
#
# 方案 B：每个 workspace 由 `backend/app/vibe_coding/k8s_runtime.py` 在
#        `ensure_container()` 中动态创建一个独立 Ingress object，
#        host = `{ws_id}.vibe-first.cn`，backend 直接指向对应 Service。
#        删除 workspace 时同步 delete Ingress。
#
#        优点：避开 if-is-evil 兼容性问题，每个 ingress 是简单 path-based
#             proxy_pass。
#        缺点：ingress object 数量随 workspace 线性增长（trial 阶段 <100
#             可接受）。
#
# TODO（k8s_runtime.py）：
#   - 加 `_ensure_ingress(ws_id)` 方法
#   - 加 `_delete_ingress(ws_id)` 方法
#   - `ensure_container()` 末尾调用 _ensure_ingress
#   - `remove()` 调用 _delete_ingress
#   - RBAC 已含 ingress create/delete 权限（deploy/k8s/60-vibe-rbac.yaml）
#
# 本文件保留 placeholder Service 不删 — k8s_runtime.py 测试期可能引用为
# fallback；待 ingress 动态化落地后再决定是否清理本文件。
---
# Placeholder Service — 不路由任何流量，仅作 k8s_runtime.py 单测 fallback
# headless ClusterIP=None 不占 IP
apiVersion: v1
kind: Service
metadata:
  name: vibe-sandbox-placeholder
  namespace: apaas-builder
  labels:
    app: vibe-sandbox
    component: vibe-ingress-placeholder
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    workspace-id: placeholder-never-match
  ports:
    - name: vite
      port: 6173
      targetPort: 6173

# apaas-builder 单节点容器编排
# 详见 DEPLOY_CONTAINER.md
#
# 两种典型场景：
#   1) 主机独占（默认）：容器 8003/8080，VITE_BASE_URL=/ai-builder/
#   2) 与主机裸跑并存（线上过渡期）：容器 8103/8090，VITE_BASE_URL=/ai-builder-docker/
#      通过 env file 覆盖变量，或直接改下方 build.args 和 environment
#
# 用法：
#   cd deploy/docker
#   docker compose up -d        # 或 podman-compose up -d
#   docker compose logs -f
#
# 挂载点设计：
#   - 只挂一个持久化 volume：workspaces（npm-cache 放在它下面）
#   - .env 只读挂载
#   - 前端 dist 直接打进镜像，不再共享卷
#   - 日志走 docker logs（stdout/stderr），不落盘
#
# 前提：
#   - 宿主机建好 ${WORKSPACES_DIR} 目录
#   - ${BACKEND_ENV_FILE} 已写好
#   - 外置 MySQL 可达（DATABASE_URL 在 .env 里）

services:
  apaas-builder:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        VITE_BASE_URL: ${VITE_BASE_URL:-/ai-builder/}
    image: apaas-builder:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-apaas-builder}
    restart: unless-stopped

    network_mode: host

    env_file:
      - ${BACKEND_ENV_FILE:-/data/apaas/backend.env}

    environment:
      PORT: ${PORT:-8003}
      CODE_SERVER_PORT: ${CODE_SERVER_PORT:-8080}

    volumes:
      # 唯一持久化卷（workspaces + npm-cache 都在这里）
      - ${WORKSPACES_DIR:-/data/apaas/workspaces}:/root/apaas-builder/workspaces
      # .env 只读挂载
      - ${BACKEND_ENV_FILE:-/data/apaas/backend.env}:/app/backend/.env:ro

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${PORT:-8003}/api/health && curl -fsS http://127.0.0.1:${PORT:-8003}/openapi.json | grep -q /harness/coding/pipeline"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

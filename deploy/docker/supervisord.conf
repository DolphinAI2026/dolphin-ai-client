; apaas-builder 容器内进程管理
; 所有日志直接写 /dev/stdout、/dev/stderr，由 docker logs 统一收集
; 详见 DEPLOY_CONTAINER.md

[supervisord]
nodaemon=true
logfile=/dev/stderr
logfile_maxbytes=0
loglevel=info
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface


; ------------------------------------------------------------
; 后端 uvicorn
;   端口由 PORT 环境变量控制（默认 8003）
;   --workers 1：platform_proxy._proxy_state 是模块级全局 dict，
;   多 worker 下 iframe 后续请求会打到空状态 worker
;   cwd 必须是 /app/backend，否则 app.main:app 会 ModuleNotFoundError
; ------------------------------------------------------------
[program:uvicorn]
command=sh -c 'exec python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8003} --workers 1'
directory=/app/backend
autostart=true
autorestart=true
startretries=3
startsecs=5
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"


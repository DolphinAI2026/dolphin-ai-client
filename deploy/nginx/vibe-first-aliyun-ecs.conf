# /etc/nginx/conf.d/vibe-first.conf
# 阿里云 ECS (39.103.201.110 / agent.dfy.definesys.cn) 公网入口反代到 k8s nginx-ingress
# 让 https://{workspace_id}.vibe-first.cn → k8s ingress (172.23.39.215) → vibe-svc-{ws_id} Service → vibe-sandbox-{ws_id} Pod
#
# 部署：
#   1. scp 本文件到 ECS:/etc/nginx/conf.d/vibe-first.conf
#      或者 cat 进去
#   2. nginx -t   # 语法检查
#   3. systemctl reload nginx
#   4. 检查 systemctl status nginx 没报错

# k8s nginx-ingress 4 个节点 IP（参考 ingress controller 当前状态）
# kubectl get ingress -A 时 ADDRESS 列就是这几个
upstream vibe_k8s_ingress {
  server 172.23.39.215:80;
  server 172.23.39.234:80;
  server 172.23.39.237:80;
  server 172.23.39.246:80;
  keepalive 32;
}

# 主域 vibe-first.cn（用户访问根域显示导航 / 404，不实际用）
server {
  listen 80;
  listen 443 ssl http2;
  server_name vibe-first.cn;

  # TLS 证书：复用通配证书 *.vibe-first.cn（如果之前部署过应该已在 ECS 上）
  # 没有的话用 acme.sh 或 certbot 申请：
  #   acme.sh --issue -d vibe-first.cn -d '*.vibe-first.cn' --dns
  ssl_certificate     /etc/nginx/certs/vibe-first.cn.fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/vibe-first.cn.key;
  ssl_protocols       TLSv1.2 TLSv1.3;

  return 301 https://vibe-first.cn$request_uri;
}

# 子域通配 *.vibe-first.cn — vibe-coding 沙箱预览
server {
  listen 80;
  listen 443 ssl http2;
  server_name *.vibe-first.cn;

  ssl_certificate     /etc/nginx/certs/vibe-first.cn.fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/vibe-first.cn.key;
  ssl_protocols       TLSv1.2 TLSv1.3;

  # SSE / WebSocket / 长连接友好
  proxy_buffering off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  client_max_body_size 100m;

  location / {
    # Host 透传 — k8s ingress 按 *.vibe-first.cn 匹配规则，server-snippet 解析子域名
    proxy_pass http://vibe_k8s_ingress;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

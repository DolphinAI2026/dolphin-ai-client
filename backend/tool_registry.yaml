# backend/tool_registry.yaml — Single source of truth for all MCP tool metadata.
# Loaded at startup by backend (FastAPI) + mcp_server (separate process).
# 派生视图: backend/app/tool_registry.py — tools_for_section(s) / tools_for_agent(a) / all_tool_names()
#
# 加新工具流程:
#   1) backend/app/mcp_server.py 加 @mcp.tool() 装饰的 async def
#   2) 本文件加 entry (sections + agents + category + description)
#   3) 跑 backend/tests/test_tool_registry.py 确认 CI 过
#
# 字段含义:
#   sections  ConfigAssistant 软引导 affinity (SPEC v2 §1.2 — 不是硬白名单)
#             取值: data / ui / logic / permission / extension / global
#   agents    dolphin agent prompt 白名单 — 决定哪些 agent 看到本工具
#             取值: builder / coding / vibe / config
#             空 list 表示工具已实现但 agent prompt 文档未列入 (维持现状, 别偷加)
#   category  工具语义标签 (内省用, 不影响行为)
#
# 2026-05-26 生成: 114 工具 (mcp_server.py 实测).
version: 1
tools:
  add_apaas_dict_option:
    sections: [data]
    agents: [builder, config]
    category: update
    description: "给字典加一个选项。"
  add_apaas_model_field:
    sections: [data]
    agents: [builder, config]
    category: update
    description: "给已有模型加一个字段。"
  attach_dev_packages_to_apaas_app:
    sections: [extension]
    agents: [coding, config]
    category: other
    description: "把已上传到 apaas 平台的自开发包（zip）关联到应用的「自开发资源」列表。"
  bind_apaas_form_field_to_dict:
    sections: [data, ui]
    agents: [config]
    category: other
    description: "把表单字段的\"数据来源\"绑定到指定数据字典 (切组件 + source.type + 选项三件套)."
  browser_click:
    sections: [ui]
    agents: [config]
    category: browser_control
    description: "点击 a11y tree 里的某个元素（uid 由 browser_snapshot 返回）。"
  browser_list_pages:
    sections: [ui]
    agents: [config]
    category: browser_control
    description: "列出浏览器里所有打开的 tabs。优先 Chrome extension (chrome.tabs.query 拿全 tab,"
  browser_navigate:
    sections: [ui]
    agents: [config]
    category: browser_control
    description: "让当前活动 tab 跳到指定 URL。等页面加载完返回。"
  browser_press_key:
    sections: [ui]
    agents: [config]
    category: browser_control
    description: "在指定 frame 内按一个键 (Enter/Tab/Escape/ArrowDown/...)."
  browser_screenshot:
    sections: [ui]
    agents: [config]
    category: browser_control
    description: "截当前 tab 视口（PNG），返 base64 data URL，前端 <img> 可直显示。"
  browser_select_page:
    sections: [ui]
    agents: [config]
    category: browser_control
    description: "切换到指定 tab 当作\"活动 page\" — 后续 snapshot/click/type 都作用在它上。"
  browser_snapshot:

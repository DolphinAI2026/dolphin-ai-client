# backend/tool_registry.yaml — Single source of truth for all MCP tool metadata.
# Loaded at startup by backend (FastAPI) + mcp_server (separate process).
# 派生视图: backend/app/tool_registry.py — tools_for_section(s) / tools_for_agent(a) / all_tool_names()
#
# 加新工具流程:
#   1) backend/app/mcp_server.py 或 backend/app/mcp_tools/*.py 加 @mcp.tool() 装饰的 async def
#   2) 本文件加 entry (sections + agents + category + description)
#   3) 跑 backend/tests/test_tool_registry.py 确认 CI 过
#
# 字段含义:
#   sections  ConfigAssistant 软引导 affinity (SPEC v2 §1.2 — 不是硬白名单)
#             取值: data / ui / logic / permission / extension / global
#   agents    dolphin agent prompt 白名单 — 决定哪些 agent 看到本工具
#             取值: builder / coding / vibe / config
#             空 list 表示工具已实现但 agent prompt 文档未列入 (维持现状, 别偷加)
#   category  工具语义标签 (内省用, 不影响行为)
#
# 2026-05-26 生成: 114 工具 (mcp_server.py 实测).

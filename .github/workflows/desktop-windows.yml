name: Windows desktop package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the desktop package, for example 0.2.37"
        required: false
        default: ""
      bundle:
        description: "Tauri Windows bundle target"
        required: true
        default: "nsis"
        type: choice
        options:
          - nsis
          - msi
          - all

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $args = @("-Bundle", "${{ inputs.bundle }}")
          if ("${{ inputs.version }}") {
            $args += @("-Version", "${{ inputs.version }}")
          }
          ./scripts/build-desktop-windows.ps1 @args

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-code-windows-${{ inputs.version || github.run_number }}
          if-no-files-found: error
          path: |
            dist-desktop/windows/*
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/nsis/*.zip
            src-tauri/target/**/release/bundle/nsis/*.sig
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/msi/*.zip
            src-tauri/target/**/release/bundle/msi/*.sig

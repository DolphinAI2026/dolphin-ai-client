name: DolphinAI Windows portable debug

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional debug package version
        required: false
        default: ''
        type: string

env:
  AGENT_RUNTIME_REPO_URL: https://git.dfy.definesys.cn/orcamatrix/agent-runtime.git
  AGENT_RUNTIME_REVISION: c98437dbde5c803670a8694c7558870a05eb4c6e
  AGENTIC_CODING_REPO_URL: https://git.dfy.definesys.cn/support/agentic-coding.git
  AGENTIC_CODING_REVISION: 14844c2b8d85a20b2c1c17aa46eb88f07eb8d5c7
  CODEX_VERSION: 0.147.0

jobs:
  portable-debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@stable

      - name: Checkout fixed runtime dependencies
        shell: pwsh
        env:
          DEFINESYS_GIT_USERNAME: ${{ secrets.DEFINESYS_GIT_USERNAME }}
          DEFINESYS_GIT_TOKEN: ${{ secrets.DEFINESYS_GIT_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:DEFINESYS_GIT_USERNAME -or -not $env:DEFINESYS_GIT_TOKEN) { throw 'Internal Git credentials are required.' }
          $credentialUrl = "https://$($env:DEFINESYS_GIT_USERNAME):$($env:DEFINESYS_GIT_TOKEN)@git.dfy.definesys.cn/"
          git config --global "url.$credentialUrl.insteadOf" 'https://git.dfy.definesys.cn/'
          git clone $env:AGENT_RUNTIME_REPO_URL "$env:GITHUB_WORKSPACE\..\agent-runtime"
          git -C "$env:GITHUB_WORKSPACE\..\agent-runtime" checkout --detach $env:AGENT_RUNTIME_REVISION
          git clone $env:AGENTIC_CODING_REPO_URL "$env:GITHUB_WORKSPACE\..\agentic-coding"
          git -C "$env:GITHUB_WORKSPACE\..\agentic-coding" checkout --detach $env:AGENTIC_CODING_REVISION

      - name: Build Builder and Python runtime dependencies
        shell: pwsh
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\..\agent-runtime\web\builder"
          npm ci
          npm run build
          Set-Location "$env:GITHUB_WORKSPACE\..\agentic-coding"
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Install fixed Codex native package
        shell: pwsh
        run: |
          npm install --prefix .codex-native --no-save --no-package-lock --ignore-scripts "@openai/codex@$env:CODEX_VERSION"
          $codexRoot = Join-Path $env:GITHUB_WORKSPACE '.codex-native\node_modules\@openai\codex-win32-x64\vendor\x86_64-pc-windows-msvc'
          if (-not (Test-Path "$codexRoot\bin\codex.exe" -PathType Leaf)) { throw "Fixed Codex package is incomplete." }
          "CODEX_NATIVE_ROOT=$codexRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build unsigned portable debug package
        shell: pwsh
        run: |
          $args = @('-Bundle', 'portable')
          if ('${{ inputs.version }}') { $args += @('-Version', '${{ inputs.version }}') }
          ./scripts/build-desktop-windows.ps1 @args

      - name: Upload portable debug package
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-ai-windows-portable-debug-${{ github.run_number }}
          if-no-files-found: error
          path: dist-desktop/windows/dolphin-ai-*-windows-x86_64-portable.zip

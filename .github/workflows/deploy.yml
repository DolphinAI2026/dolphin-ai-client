name: 部署到线上环境

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: 构建并部署
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 构建前端
        working-directory: frontend
        run: VITE_BASE_URL=/ai-builder/ npx vite build

      - name: 安装 paramiko
        run: pip install paramiko

      - name: 部署到服务器
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          python3 << 'PYEOF'
          import os, io, tarfile, time
          import paramiko
          from pathlib import Path

          HOST     = os.environ['SERVER_HOST']
          USER     = os.environ['SERVER_USER']
          PASSWORD = os.environ['SERVER_PASSWORD']

          BACKEND_DIR      = Path('backend')
          FRONTEND_DIST    = Path('frontend/dist')
          REMOTE_BACKEND   = '/root/apaas-builder/backend'
          REMOTE_FRONTEND  = '/root/apaas-builder/frontend/dist'

          BACKEND_EXCLUDES = {'.env', 'venv', '.venv', '__pycache__', '.DS_Store'}

          def should_exclude(rel):
              for part in Path(rel).parts:
                  if part in BACKEND_EXCLUDES: return True
                  if part.endswith(('.pyc', '.log', '.db')): return True
              return False

          def make_tar(base_dir, exclude_fn=None):
              buf = io.BytesIO()
              with tarfile.open(fileobj=buf, mode='w:gz') as tar:
                  for path in Path(base_dir).rglob('*'):
                      if path.is_file():
                          rel = str(path.relative_to(base_dir))
                          if exclude_fn and exclude_fn(rel): continue
                          tar.add(str(path), arcname=rel)
              buf.seek(0)
              return buf.read()

          print('=== 连接服务器 ===')
          client = paramiko.SSHClient()
          client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          client.connect(HOST, username=USER, password=PASSWORD,
                         timeout=30, allow_agent=False, look_for_keys=False)
          sftp = client.open_sftp()

          def run(cmd):
              _, stdout, stderr = client.exec_command(cmd)
              out = stdout.read().decode().strip()
              err = stderr.read().decode().strip()
              if out: print(f'  > {out}')
              if err: print(f'  ! {err}')

          print('=== 打包并上传后端 ===')
          data = make_tar(BACKEND_DIR, should_exclude)
          print(f'  大小: {len(data)//1024} KB')
          with sftp.open('/tmp/backend_deploy.tar.gz', 'wb') as f: f.write(data)
          run(f'tar -xzf /tmp/backend_deploy.tar.gz -C {REMOTE_BACKEND}/ && rm -f /tmp/backend_deploy.tar.gz')
          print('  后端上传完成')

          print('=== 打包并上传前端 ===')
          data = make_tar(FRONTEND_DIST)
          print(f'  大小: {len(data)//1024} KB')
          with sftp.open('/tmp/frontend_deploy.tar.gz', 'wb') as f: f.write(data)
          run(f'rm -rf {REMOTE_FRONTEND} && mkdir -p {REMOTE_FRONTEND}')
          run(f'tar -xzf /tmp/frontend_deploy.tar.gz -C {REMOTE_FRONTEND}/ && rm -f /tmp/frontend_deploy.tar.gz')
          print('  前端上传完成')

          print('=== 安装依赖 ===')
          run(f'cd {REMOTE_BACKEND} && .venv/bin/pip install -q -r requirements.txt')

          print('=== 重启后端 ===')
          # 匹配 `uvicorn app.main:app` 和老命令 `uvicorn main:app`，都带 8003
          # 必须两种都杀，否则老进程会继续占端口让健康检查通过，掩盖新进程 crash
          try:
              run("pkill -9 -f 'uvicorn.*:app.*8003' || true")
              time.sleep(3)
              run("pgrep -f 'uvicorn.*:app.*8003' || echo '  端口 8003 上无残留 uvicorn 进程'")
          except Exception:
              pass
          # cwd 必须是 backend/，否则 `app.main:app` import 不到（ModuleNotFoundError: No module named 'app'）
          try:
              transport = client.get_transport()
              chan = transport.open_session()
              chan.exec_command("cd /root/apaas-builder/backend && nohup .venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8003 --workers 2 >> ../backend.log 2>&1 &")
              chan.close()
          except Exception:
              pass
          try:
              sftp.close()
              client.close()
          except Exception:
              pass

          # 重启后重新建立连接做健康检查
          time.sleep(6)
          print('=== 健康检查 ===')
          client2 = paramiko.SSHClient()
          client2.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          client2.connect(HOST, username=USER, password=PASSWORD,
                          timeout=30, allow_agent=False, look_for_keys=False)
          _, stdout, _ = client2.exec_command("curl -s -o /dev/null -w '%{http_code}' http://localhost:8003/api/health")
          code = stdout.read().decode().strip()
          print(f'  /api/health 状态码: {code}')
          if code != '200':
              _, stdout, _ = client2.exec_command('tail -40 /root/apaas-builder/backend.log')
              print(stdout.read().decode())
              client2.close()
              raise Exception('健康检查失败：/api/health 未返回 200')

          # 真实路由探测：老代码没有 harness 路由，能骗过 /api/health 但骗不过这里
          _, stdout, _ = client2.exec_command("curl -s http://localhost:8003/openapi.json | grep -c '/harness/coding/pipeline' || true")
          harness_hit = stdout.read().decode().strip()
          print(f'  openapi 含 harness/coding/pipeline 命中数: {harness_hit}')
          if harness_hit == '0':
              _, stdout, _ = client2.exec_command('tail -40 /root/apaas-builder/backend.log')
              print(stdout.read().decode())
              client2.close()
              raise Exception('健康检查失败：新路由未注册，可能跑的是老进程')

          client2.close()
          print('=== 部署成功 ===')
          PYEOF

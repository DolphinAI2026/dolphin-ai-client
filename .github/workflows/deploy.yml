name: 部署到线上环境

on:
  workflow_dispatch:

jobs:
  deploy:
    name: 构建并部署
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 构建前端
        working-directory: frontend
        run: VITE_BASE_URL=/ai-builder/ npx vite build

      - name: 打包后端
        run: |
          cd backend
          tar --exclude='.env' \
              --exclude='venv' \
              --exclude='.venv' \
              --exclude='__pycache__' \
              --exclude='*.pyc' \
              --exclude='*.db' \
              --exclude='*.log' \
              --exclude='.DS_Store' \
              -czf /tmp/backend.tar.gz .
          echo "后端包大小: $(du -sh /tmp/backend.tar.gz | cut -f1)"

      - name: 打包前端
        run: |
          cd frontend/dist
          tar -czf /tmp/frontend.tar.gz .
          echo "前端包大小: $(du -sh /tmp/frontend.tar.gz | cut -f1)"

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          # 用 printf 写入，避免 echo 丢失换行导致密钥格式损坏
          printf '%s' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 验证密钥格式
          ssh-keygen -l -f ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: 上传后端
        run: |
          scp -i ~/.ssh/deploy_key /tmp/backend.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/backend.tar.gz
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "tar -xzf /tmp/backend.tar.gz -C /root/apaas-builder/backend/ && rm -f /tmp/backend.tar.gz && echo '后端解压完成'"

      - name: 上传前端
        run: |
          scp -i ~/.ssh/deploy_key /tmp/frontend.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/frontend.tar.gz
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "rm -rf /root/apaas-builder/frontend/dist && mkdir -p /root/apaas-builder/frontend/dist && tar -xzf /tmp/frontend.tar.gz -C /root/apaas-builder/frontend/dist/ && rm -f /tmp/frontend.tar.gz && echo '前端解压完成'"

      - name: 安装依赖并重启后端
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash << 'EOF'
            set -e

            echo "=== 安装 Python 依赖 ==="
            cd /root/apaas-builder/backend
            .venv/bin/pip install -q -r requirements.txt

            echo "=== 重启后端 ==="
            pkill -f 'uvicorn app.main:app.*8003' || true
            sleep 2
            cd /root/apaas-builder
            nohup backend/.venv/bin/python -m uvicorn app.main:app \
              --host 0.0.0.0 --port 8003 --workers 2 >> backend.log 2>&1 &
            disown

            echo "=== 等待启动 ==="
            sleep 5

            echo "=== 健康检查 ==="
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8003/api/health)
            echo "健康检查状态码: $STATUS"
            if [ "$STATUS" != "200" ]; then
              echo "健康检查失败！最近日志："
              tail -20 /root/apaas-builder/backend.log
              exit 1
            fi

            echo "=== 部署成功 ==="
          EOF
